<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo-ies.png">
</head>
<body>
<title>Aula de Prevención</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: consola de tutoría para pizarra digital — banda institucional, raíl de 5 pasos de la sesión, área de proyección grande; tokens de color de Protección Civil (azul + naranja) */
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#14233a; --muted:#56667b; --line:#d5dee9;
  --blue:#1a6dbf; --blue-d:#0f4a8a; --orange:#e2700a; --ok:#1d8048; --bad:#bf3626;
  --chip:#e4eef9; --soft:#f6f9fc; --warn:#fff3e3; --band:#0f4a8a; --band-ink:#ffffff; --on-accent:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1520; --card:#132132; --ink:#e5ecf4; --muted:#9fb1c6; --line:#25394f;
  --blue:#5ea8ec; --blue-d:#a3cdf4; --orange:#f5a04a; --ok:#55c487; --bad:#f17a69;
  --chip:#1a3049; --soft:#0f1b29; --warn:#2b2114; --band:#0a2a4d; --band-ink:#ffffff; --on-accent:#0b1a2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1520; --card:#132132; --ink:#e5ecf4; --muted:#9fb1c6; --line:#25394f;
  --blue:#5ea8ec; --blue-d:#a3cdf4; --orange:#f5a04a; --ok:#55c487; --bad:#f17a69;
  --chip:#1a3049; --soft:#0f1b29; --warn:#2b2114; --band:#0a2a4d; --band-ink:#ffffff; --on-accent:#0b1a2a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2rem,4.5vw,3rem);font-weight:700}
h2{font-size:1.7rem;font-weight:700}
h3{font-size:1.3rem;font-weight:600}
p{margin:0}
a{color:var(--blue)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-size:.88rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:.88rem;color:var(--muted);font-weight:400}
.err{color:var(--bad);font-weight:600}
.okt{color:var(--ok);font-weight:600}

.top{background:var(--band);color:var(--band-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.logo{display:block;width:46px;height:auto;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1;font-weight:700}
.brand small{display:block;font-size:.8rem;opacity:.8}
.topctx{margin-left:auto;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.04em;opacity:.95;text-align:right}

main{padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.lead{font-size:1.12rem;color:var(--muted);max-width:64ch}
.banner{background:var(--warn);border:1px solid color-mix(in srgb,var(--orange) 40%,transparent);border-radius:10px;padding:12px 16px;font-size:.95rem}
label{font-weight:600;font-size:.95rem;display:flex;flex-direction:column;gap:5px}
input[type=text],input[type=password],textarea,select{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 20px;background:var(--blue);color:var(--on-accent);font-family:var(--f-display);font-weight:600;font-size:1.12rem;letter-spacing:.04em;cursor:pointer;text-decoration:none;min-height:48px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.orange{background:var(--orange)}
.btn.big{font-size:1.35rem;padding:16px 26px;min-height:60px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--chip);font-family:var(--f-display);font-size:1.02rem;letter-spacing:.03em}

/* Portada */
.portada{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.logo-grande{width:clamp(96px,14vw,150px);height:auto;flex:none}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.door{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.door:hover{border-color:var(--blue);transform:translateY(-2px)}
.door .ico{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--blue)}
.door.main{border:2px solid var(--blue)}
.door p{color:var(--muted)}
/* Portada: módulos protagonistas, accesos discretos */
.portada.compacta{gap:18px}
.portada.compacta .logo-grande{width:clamp(64px,8vw,96px)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.mod{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s,box-shadow .2s;min-height:190px}
.mod:hover,.mod:focus-visible{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 10px 24px color-mix(in srgb,var(--blue) 18%,transparent)}
.mimg{position:relative;display:block;background:#0b1622}
.mimg img{display:block;width:100%;height:100%;object-fit:cover}
.mn{position:absolute;left:12px;top:8px;font-family:var(--f-display);font-size:clamp(3rem,6vw,4.6rem);font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.mbody{display:flex;flex-direction:column;gap:8px;padding:18px 20px}
.mbody h2{font-size:clamp(1.6rem,2.6vw,2.1rem)}
.mmeta{color:var(--muted);font-size:.95rem}
.mgo{margin-top:auto;font-family:var(--f-display);font-weight:600;font-size:1.2rem;letter-spacing:.03em;color:var(--blue)}
@media (max-width:560px){.mod{grid-template-columns:1fr}.mimg img{aspect-ratio:16/9;height:auto}}
.accesos{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;align-self:center}
.acc{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:.98rem}
.acc:hover{border-color:var(--blue);color:var(--blue)}
.acc .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--chip);color:var(--blue)}
.acc .ico svg{width:18px;height:18px}
.pie{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.admlink{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);text-decoration:none;opacity:.75}
.admlink:hover{opacity:1;color:var(--blue);text-decoration:underline}
.admlink svg{width:14px;height:14px}
.sesgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.ses{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ses .n{font-family:var(--f-display);font-size:2.4rem;font-weight:700;color:var(--orange);line-height:.9}
.ses p{color:var(--muted);font-size:.95rem}
.ses img{border-radius:6px;border:1px solid var(--line);aspect-ratio:16/9;object-fit:cover;width:100%}
button.ses{text-align:left;cursor:pointer}
button.ses:hover{border-color:var(--blue)}
button.ses[aria-pressed="true"]{border:2px solid var(--blue);background:var(--chip)}

/* Sesión del tutor */
.console{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.console{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
@media (max-width:900px){.rail{flex-direction:row;overflow-x:auto;position:static}}
.rail button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;font-family:var(--f-display);font-size:1.2rem;font-weight:600;min-height:56px;white-space:nowrap}
.rail button .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--blue);font-size:1.05rem;flex:none}
.rail button[aria-current="step"]{border:2px solid var(--blue);background:var(--chip)}
.rail button.done .k{background:var(--ok);color:#fff}
.stage{min-width:0;display:flex;flex-direction:column;gap:16px}
.stagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.att button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:12px 14px;cursor:pointer;font-weight:500;min-height:54px}
.att button .st{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.att button[aria-pressed="false"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.att button[aria-pressed="false"] .st{color:var(--bad)}
.att button[aria-pressed="false"] .nm{text-decoration:line-through;opacity:.7}
.counter{font-family:var(--f-display);font-size:1.5rem;font-weight:700}

.slidebox{background:#0b1622;border-radius:12px;overflow:hidden;position:relative}
.slidebox img{display:block;width:100%;height:auto;aspect-ratio:1912/1067;object-fit:contain;background:#0b1622}
.slidebox:fullscreen{display:flex;align-items:center;justify-content:center}
.slidebox:fullscreen img{max-height:100vh;width:auto;max-width:100vw}
.slidebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slidebar .pos{font-family:var(--f-display);font-size:1.4rem;font-weight:700;min-width:5ch;text-align:center}
.navbtn{width:64px;height:56px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.6rem;cursor:pointer}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:none;border:2px solid transparent;border-radius:6px;padding:0;background:none;cursor:pointer;width:120px}
.thumbs button[aria-current="true"]{border-color:var(--orange)}
.thumbs img{display:block;width:100%;border-radius:4px}
.tap{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer}
.tap.l{left:0}.tap.r{right:0}

.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.media figure{margin:0;display:flex;flex-direction:column;gap:8px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#0b1622;border-radius:10px;overflow:hidden}
.frame iframe,.frame video{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame.h5p{aspect-ratio:auto;height:min(70vh,640px);background:var(--card);border:1px solid var(--line)}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600}

/* Test proyectado */
.proj{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;gap:18px}
.proj .q{font-family:var(--f-display);font-size:clamp(1.6rem,3.2vw,2.6rem);font-weight:600;line-height:1.15}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.popt{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:16px 18px;font-size:clamp(1.1rem,1.8vw,1.45rem);background:var(--soft)}
.popt b{font-family:var(--f-display);font-size:1.8rem;color:var(--blue);width:1.2em;flex:none}
.popt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.popt.dim{opacity:.45}
button.popt{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;font-size:clamp(1.1rem,1.8vw,1.45rem)}
button.popt:hover:not([disabled]){border-color:var(--blue)}
.popt.wrongp{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.explain.bad{border-left-color:var(--bad)}
.deck{display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
.deck.withmedia{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
@media (max-width:900px){.deck.withmedia{grid-template-columns:1fr}}
.dmedia img{display:block;width:100%;max-height:56vh;object-fit:contain;border-radius:10px}
.dmedia .frame{aspect-ratio:16/9}
.votes{display:flex;flex-direction:column;gap:10px}
.vote{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.vote .popt{position:relative;overflow:hidden}
.vote .popt .vbar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--blue) 14%,transparent);z-index:0;transition:width .3s}
.vote .popt>*:not(.vbar){position:relative;z-index:1}
.vote .popt .vc{margin-left:auto;font-family:var(--f-display);font-size:1.8rem;font-weight:700;color:var(--blue-d);padding-left:12px}
.vote .popt.right .vbar{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.minus{width:56px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:1.6rem;cursor:pointer}
.slidefocus{display:flex;flex-direction:column;gap:14px;align-items:center}
.qmini{font-family:var(--f-display);font-size:clamp(1.05rem,2vw,1.55rem);font-weight:600;color:var(--muted);text-align:center;max-width:72ch;line-height:1.2}
.bigslide{display:block;width:100%;max-width:1400px;max-height:min(74vh,calc(100vh - 290px));object-fit:contain;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.slidefocus:fullscreen{background:var(--card);justify-content:center;padding:10px;gap:8px}
.slidefocus:fullscreen .bigslide{max-height:92vh;max-width:98vw;border:0}
.proj:has(.slidefocus){padding:16px}
.stage.focus .stagehead{display:none}
.reps{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:12px;font-size:clamp(1.05rem,1.9vw,1.5rem);line-height:1.25;color:var(--muted)}
.reps li::marker{color:var(--orange)}
.ideas{border:1px dashed var(--line);border-radius:10px;background:var(--soft);padding:12px 14px;font-size:.95rem;color:var(--muted)}
.dq{font-family:var(--f-display);font-size:clamp(1.8rem,3.6vw,3rem);font-weight:600;line-height:1.12}
.dslide img{display:block;width:100%;border-radius:10px;border:1px solid var(--line)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.dots button[aria-current="true"]{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.dots button.seen{border-color:var(--ok)}
.guide li{margin-bottom:6px}.guide .sub{color:var(--muted);font-size:.95rem}
.explain{font-size:1.2rem;border-left:5px solid var(--ok);padding:8px 14px}

/* Actividades (comunes a pizarra y portátil) */
.part{display:flex;flex-direction:column;gap:12px}
.parthead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--orange)}
fieldset{margin:0;min-width:0}
.qq{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.qq legend{font-weight:600;padding:0}
.qq.good{border-color:var(--ok)}.qq.wrong{border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:400;flex-direction:row;background:var(--soft)}
.opt:has(input:checked){border-color:var(--blue);background:var(--chip)}
.opt input{margin-top:5px;accent-color:var(--blue)}
.fb{font-size:.95rem;padding:8px 12px;border-radius:8px;background:var(--soft)}
.fb.good{color:var(--ok)}.fb.wrong{color:var(--bad)}.fb span{color:var(--ink)}
.cls{display:flex;flex-direction:column;gap:8px}
.cls .it{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.cls .it.good{border-color:var(--ok)}.cls .it.wrong{border-color:var(--bad)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--soft);border-radius:99px;padding:7px 14px;font-size:.92rem;font-weight:600;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.ord .pos{font-family:var(--f-display);font-weight:700;font-size:1.4rem;color:var(--blue);width:1.6em;text-align:center;flex:none}
.ord .t{flex:1;min-width:0}
.ord li.good{border-color:var(--ok)}.ord li.wrong{border-color:var(--bad)}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}
.mv button{border:1px solid var(--line);background:var(--soft);border-radius:6px;width:42px;height:30px;cursor:pointer}
.mv button[disabled]{opacity:.35}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.pick{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;font-weight:500;flex-direction:row;background:var(--soft)}
.pick:has(input:checked){border-color:var(--blue);background:var(--chip)}
.pick input{accent-color:var(--blue);width:20px;height:20px}
.pick.good{border-color:var(--ok)}.pick.wrong{border-color:var(--bad)}
.result{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.result{grid-template-columns:1fr}}
.score{font-family:var(--f-display);font-size:4.4rem;font-weight:700;line-height:.9}
.score small{font-size:1.4rem;color:var(--muted)}
.score.ok{color:var(--ok)}.score.bad{color:var(--bad)}

.codebig{font-family:var(--f-display);font-size:clamp(4rem,12vw,9rem);font-weight:700;letter-spacing:.18em;color:var(--blue-d);line-height:1}
.guion{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.guion{grid-template-columns:1fr}}
.guion ul,.guion ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.tiempo{display:flex;flex-direction:column;gap:6px}
.tiempo div{display:flex;gap:12px;align-items:baseline}
.tiempo b{font-family:var(--f-display);font-size:1.3rem;color:var(--orange);width:3.2em;flex:none;text-align:right}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.checks label{flex-direction:row;align-items:center;gap:10px;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.checks input{width:20px;height:20px;accent-color:var(--blue)}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card)}
.dropzone.over{border-color:var(--blue);background:var(--chip)}
.ficha{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px;max-width:900px}
.fichahd{display:flex;gap:16px;align-items:center}
.fichahd img{flex:none;width:78px;height:auto}
.ficha .line{border-bottom:1px solid var(--ink);min-height:30px}
.ficha .box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ficha .box b{font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--blue-d)}
.ficha .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.ficha .cols{grid-template-columns:1fr}}
.rub td:first-child{font-weight:600}
.credit{border-top:1px solid var(--line);margin-top:40px}
.credit .wrap{padding-block:16px;font-size:.85rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff;color:#000}.top,.no-print,.rail{display:none!important}main{padding:0}.ficha{border:0;padding:0}.console{display:block}}

/* ===== PRL: identidad propia (franja de seguridad) ===== */
.top{border-bottom:6px solid transparent;border-image:repeating-linear-gradient(-45deg,#f6c400 0 14px,#14233a 14px 28px) 6}
.formsw{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.formsw:hover{border-color:var(--blue);color:var(--blue)}
.mimg.picto{display:grid;place-items:center;background:#0f4a8a;min-height:170px}
.mimg.picto svg{width:56%;max-width:150px;height:auto}
.ctxseg{display:flex;gap:8px;flex-wrap:wrap}
.ctxseg button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px 18px;font-family:var(--f-display);font-size:1.2rem;font-weight:600;cursor:pointer;min-height:52px}
.ctxseg button[aria-pressed="true"]{border-color:var(--blue);background:var(--chip);color:var(--blue-d)}

/* ===== Diapositivas HTML (siempre en claro, como en el proyector) ===== */
.sld{--s-ink:#14233a;--s-mut:#56667b;--s-blue:#0f4a8a;--s-acc:#e2700a;container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:#fff;color:var(--s-ink);border-radius:10px;overflow:hidden;font-family:var(--f-body);text-align:left;display:block}
.sld *{box-sizing:border-box}
.sld .in{position:absolute;inset:0;padding:5cqw 5.5cqw 4cqw;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;column-gap:4cqw}
.sld .hd{grid-column:1/-1;display:flex;align-items:center;gap:2cqw;border-bottom:.5cqw solid var(--s-blue);padding-bottom:1.6cqw;margin-bottom:2.6cqw}
.sld .hd .no{font-family:var(--f-display);font-weight:700;font-size:2.2cqw;color:#fff;background:var(--s-blue);border-radius:.8cqw;padding:.3cqw 1.2cqw;flex:none}
.sld h3{font-family:var(--f-display);font-weight:700;font-size:5cqw;line-height:1.02;margin:0;color:var(--s-ink)}
.sld .bd{min-width:0;align-self:start}
.sld ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:1.5cqw;font-size:2.65cqw;line-height:1.25}
.sld li::marker{color:var(--s-acc)}
.sld .ic{align-self:center;width:21cqw;height:21cqw;border-radius:3cqw;background:#e4eef9;color:var(--s-blue);display:grid;place-items:center}
.sld .ic svg{width:62%;height:62%}
.sld .fr{grid-column:1/-1;margin-top:2cqw;background:#fff3e3;border-left:1cqw solid var(--s-acc);border-radius:.8cqw;padding:1.4cqw 2cqw;font-family:var(--f-display);font-weight:600;font-size:2.9cqw;line-height:1.15}
.sld.port{background:#0f4a8a;color:#fff}
.sld.port .in{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:1fr auto;align-items:center}
.sld.port h3{color:#fff;font-size:7.4cqw;grid-column:1}
.sld.port .sb{grid-column:1;font-family:var(--f-display);font-size:3.2cqw;letter-spacing:.04em;opacity:.9;margin-top:2cqw}
.sld.port .ic{grid-row:1/3;grid-column:2;background:rgba(255,255,255,.12);color:#fff;width:27cqw;height:27cqw}
.sld.port::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.6cqw;background:repeating-linear-gradient(-45deg,#f6c400 0 2cqw,#14233a 2cqw 4cqw)}
.sld.port .ies{position:absolute;left:5.5cqw;top:3.6cqw;font-family:var(--f-display);font-size:2cqw;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.sld table{border-collapse:collapse;width:100%;font-size:2.4cqw}
.sld th,.sld td{border:.15cqw solid #d5dee9;padding:1.1cqw 1.4cqw;vertical-align:top;text-align:left}
.sld th{background:#e4eef9;font-family:var(--f-display);font-size:2.7cqw;color:var(--s-blue);width:24%}
.sld .pir{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.sld .pir div{background:var(--s-blue);color:#fff;border-radius:.6cqw;padding:.9cqw 1.6cqw;text-align:center;font-size:2.4cqw;display:flex;gap:1.4cqw;justify-content:center;align-items:baseline}
.sld .pir b{font-family:var(--f-display);font-size:3.6cqw}
.sld .esc{display:flex;flex-direction:column;gap:1cqw;counter-reset:e}
.sld .esc div{counter-increment:e;display:flex;gap:1.6cqw;align-items:center;border-radius:.8cqw;padding:1.1cqw 1.6cqw;font-size:2.55cqw;color:#fff}
.sld .esc div::before{content:counter(e);font-family:var(--f-display);font-weight:700;font-size:3.4cqw;width:3.5cqw;flex:none}
.sld .cols4{display:grid;grid-template-columns:repeat(2,1fr);gap:1.6cqw}
.sld .cols4 div{display:flex;gap:1.6cqw;align-items:center;border:.15cqw solid #d5dee9;border-radius:1cqw;padding:1.4cqw;font-size:2.3cqw}
.sld .cols4 i{width:6cqw;height:6cqw;border-radius:1cqw;flex:none}
.sld .cols4 b{display:block;font-family:var(--f-display);font-size:3cqw}
.sld .signs{grid-column:1/-1;display:flex;gap:3cqw;justify-content:center;margin-top:2.5cqw}
.sld .signs svg{width:13cqw;height:13cqw}
.sld .pasos{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;grid-template-columns:1fr 1fr;gap:1cqw}
.sld .pasos li{counter-increment:p;display:flex;gap:1.4cqw;align-items:flex-start;font-size:2.2cqw;line-height:1.2;border:.15cqw solid #d5dee9;border-radius:1cqw;padding:.9cqw 1.2cqw}
.sld .pasos li::before{content:counter(p);font-family:var(--f-display);font-weight:700;font-size:3.4cqw;color:var(--s-acc);line-height:.9}
.sld .pas{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw}
.sld .pas div{background:#e4eef9;border-radius:1.4cqw;padding:2cqw;text-align:center;display:flex;flex-direction:column;gap:.6cqw}
.sld .pas b{font-family:var(--f-display);font-size:12cqw;line-height:.9;color:var(--s-blue)}
.sld .pas strong{font-family:var(--f-display);font-size:3.6cqw}
.sld .pas span{font-size:2.3cqw;color:var(--s-mut)}
.sld .clp{display:flex;gap:2cqw;margin-top:2cqw}
.sld .clp svg{width:9cqw;height:9cqw}
.sld .ft{position:absolute;right:5.5cqw;bottom:1.6cqw;font-size:1.5cqw;color:var(--s-mut)}

function slideHTML(n,i){
  const S = sesion(n); const d = S && S.dias ? S.dias[i-1] : null;
  if(!d) return `<div class="sld"><div class="in"><div class="bd"><h3>Diapositiva ${i}</h3></div></div></div>`;
  if(d.portada) return `<div class="sld port" role="img" aria-label="${esc(d.t)}"><div class="in"><span class="ies">${esc(CONFIG.CENTRO)} · Prevención de Riesgos Laborales</span><div><h3>${esc(d.t)}</h3>${d.sub?`<div class="sb">${esc(d.sub)}</div>`:""}</div><div class="ic">${ico(d.ico,3.5)}</div></div></div>`;
  let cuerpo = "";
  if(d.b) cuerpo += `<ul>${d.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(d.tabla) cuerpo += `<table>${d.tabla.map(r=>`<tr><th>${esc(r[0])}</th>${r.slice(1).map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  if(d.piramide) cuerpo += `<div class="pir">${d.piramide.map((r,k)=>`<div style="width:${32+k*20}%;background:${["#bf3626","#e2700a","#d99a00","#1a6dbf"][k]}"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")}</div>`;
  if(d.escalera) cuerpo += `<div class="esc">${d.escalera.map((r,k)=>`<div style="background:${["#1d8048","#3a8f3f","#1a6dbf","#d99a00","#bf3626"][k]};width:${100-k*9}%">${esc(r)}</div>`).join("")}</div>`;
  if(d.colores) cuerpo += `<div class="cols4">${d.colores.map(r=>`<div><i style="background:${r[0]}"></i><span><b>${esc(r[1])}</b>${esc(r[2])}</span></div>`).join("")}</div>`;
  if(d.pasos) cuerpo += `<ol class="pasos">${d.pasos.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  if(d.pas) cuerpo += `<div class="pas">${d.pas.map(r=>`<div><b>${esc(r[0])}</b><strong>${esc(r[1])}</strong><span>${esc(r[2])}</span></div>`).join("")}</div>`;
  if(d.clp) cuerpo += `<div class="clp">${d.clp.map(clp).join("")}</div>`;
  const lado = d.senales ? "" : `<div class="ic">${ico(d.ico)}</div>`;
  return `<div class="sld" role="img" aria-label="${esc(d.t)}"><div class="in" style="${d.senales||d.pas||d.tabla||d.pasos?"grid-template-columns:1fr":""}">
    <div class="hd"><span class="no num">${n}.${i}</span><h3>${esc(d.t)}</h3></div>
    <div class="bd">${cuerpo}</div>${d.pas||d.tabla||d.pasos?"":lado}
    ${d.senales?`<div class="signs">${d.senales.map(senal).join("")}</div>`:""}
    ${d.frase?`<div class="fr">${esc(d.frase)}</div>`:""}</div><span class="ft">${esc(CONFIG.CENTRO)} · PRL</span></div>`;
}

   ===================================================================== */
async function api(accion, datos={}){
  if(!conectado()) return demoApi(accion, datos);
  try{
    const r = await fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion,formacion:CONFIG.FORMACION,...datos})});
    return await r.json();
  }catch(e){
    return {ok:false, error:"No se ha podido conectar con la hoja de registro. Comprueba la conexión a internet."};
  }
}
/* Modo demostración: reproduce el servidor con el almacenamiento de este equipo */
const DEMO_KEY="aulaPRL_demo";
function demoDB(){
  let d = ls(DEMO_KEY);
  if(!d){ d={curso:cursoEscolar(), alumnado:[], actas:[], sesiones:{}, resultados:[]};
    ["Alba García López","Hugo Martín Ruiz","Lucía Fernández Gil","Mario Sánchez Díaz","Paula Romero Cano","Daniel Jiménez Moreno","Sara Navarro Prieto","Iván Molina Serrano"].forEach(nm=>d.alumnado.push({grupo:"EJEMPLO 1ºA",nombre:nm+" (ejemplo)"}));
    ls(DEMO_KEY,d); }
  return d;
}
function demoApi(accion, x){
  const d = demoDB(); const save=()=>ls(DEMO_KEY,d);
  const sesionesGrupo = g => { const o={}; d.actas.filter(a=>a.grupo===g).forEach(a=>{ o[a.sesion]=a.fecha.slice(0,10); }); return o; };
  switch(accion){
    case "contenido": return (typeof CONTENIDO_DEMO!=="undefined") ? {ok:true, c:CONTENIDO_DEMO} : {ok:false, error:"Sin hoja de registro conectada no hay material: configura SCRIPT_URL."};
    case "grupos": { const m={}; d.alumnado.forEach(a=>m[a.grupo]=(m[a.grupo]||0)+1);
      return {ok:true, curso:d.curso, grupos:Object.keys(m).sort().map(g=>({grupo:g,n:m[g],sesiones:sesionesGrupo(g)}))}; }
    case "alumnos": return {ok:true, alumnos:d.alumnado.filter(a=>a.grupo===x.grupo).map(a=>a.nombre).sort((a,b)=>a.localeCompare(b,"es")), sesiones:sesionesGrupo(x.grupo)};
    case "cargarAlumnado": d.curso=x.curso; d.alumnado=x.alumnos; save(); return {ok:true,n:x.alumnos.length};
    case "abrirSesion": { const c=genCodigo(); d.sesiones[c]={grupo:x.grupo,sesion:x.sesion,creada:Date.now()}; save(); return {ok:true,codigo:c}; }
    case "sesion": { const s=d.sesiones[String(x.codigo||"").toUpperCase()]; if(!s) return {ok:false,error:"Código no válido o caducado."};
      const cs=(typeof CONTENIDO_DEMO!=="undefined"?CONTENIDO_DEMO.sesiones.filter(x=>x.n===s.sesion)[0]:null)||{};
      return {ok:true, grupo:s.grupo, sesion:s.sesion, alumnos:d.alumnado.filter(a=>a.grupo===s.grupo).map(a=>a.nombre).sort((a,b)=>a.localeCompare(b,"es")),
              contenido:{titulo:cs.titulo, quiz:cs.quiz, acts:cs.acts, reflexion:cs.reflexion}}; }
    case "resultado": { const s=d.sesiones[x.codigo]; if(!s) return {ok:false,error:"Código caducado."}; d.resultados.push({...x,grupo:s.grupo,sesion:s.sesion,fecha:new Date().toISOString()}); save(); return {ok:true}; }
    case "contarResultados": { const r=d.resultados.filter(r=>r.codigo===x.codigo); return {ok:true,n:r.length,nombres:[...new Set(r.map(r=>r.alumno))]}; }
    case "acta": d.actas.push({...x,fecha:new Date().toISOString()}); save(); return {ok:true};
  }
  return {ok:false,error:"Acción desconocida"};
}
function genCodigo(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }

const PASOS = [["asistencia","Asistencia"],["guion","Guion"],["inicio","Pregunta inicial"],["video","Vídeo"],["debate","Debate"],["test","Test final"],["recursos","Más recursos"],["cierre","Cierre y acta"]];
const SUBRECURSOS = ["presentacion","videos","actividades"];
const gw = {};   // estado de actividades en gran grupo
function marcar(k){ if(!T.hechas.includes(k)){ T.hechas.push(k); saveT(); } }

function renderSesion(){
  if(!T){ location.hash="#tutor"; return; }
  const S = sesion(T.sesion);
  topctx(`${T.grupo} · Sesión ${T.sesion}`);
  app.innerHTML = `<div class="console">
    <nav class="rail no-print" aria-label="Pasos de la sesión">${PASOS.map(([k,l],i)=>`<button type="button" data-paso="${k}" ${(T.paso===k||(k==="recursos"&&SUBRECURSOS.includes(T.paso)))?'aria-current="step"':""} class="${pasoHecho(k)?"done":""}"><span class="k num">${i+1}</span>${l}</button>`).join("")}</nav>
    <section class="stage" id="stage"></section></div>`;
  pintarPaso();
}
function pasoHecho(k){
  if(k==="asistencia") return T.hechas.includes("asistencia");
  if(k==="inicio") return T.hechas.includes("inicio");
  if(k==="video") return T.hechas.includes("video");
  if(k==="debate") return T.hechas.includes("debate");
  if(k==="test") return T.hechas.includes("h5p");
  if(k==="recursos") return T.hechas.some(h=>h==="presentacion"||h==="test"||h.startsWith("act")||h==="individual");
  if(k==="cierre") return T.guardada;
  return false;
}
function irPaso(k){ T.paso=k; saveT(); renderSesion(); window.scrollTo(0,0); }

function pintarPaso(){
  const S=sesion(T.sesion), st=document.getElementById("stage");
  st.classList.remove("focus");
  const head = (t,extra="") => `<div class="stagehead"><div><span class="eyebrow">Sesión ${S.n} · ${esc(S.titulo)}</span><h1>${t}</h1></div>${extra}</div>`;
  if(T.paso==="asistencia"){
    const pres = T.alumnos.length - T.ausentes.length;
    st.innerHTML = head("Pasar lista", `<span class="counter num" id="cnt">${pres} / ${T.alumnos.length} presentes</span>`) +
      `<p class="hint">Todos aparecen presentes. Toca a quien falte para marcarlo como ausente.</p>
      <div class="att">${T.alumnos.map((a,i)=>`<button type="button" data-al="${i}" aria-pressed="${!T.ausentes.includes(a)}"><span class="nm">${esc(a)}</span><span class="st">${T.ausentes.includes(a)?"Ausente":"Presente"}</span></button>`).join("")}</div>
      <div class="row"><button class="btn big" data-act="okAsistencia">Lista completada · Continuar</button></div>`;
  }
  else if(T.paso==="inicio"){
    const I=DEBATE[S.n].inicio; if(!T.votos) T.votos=I.o.map(()=>0);
    const tot=T.votos.reduce((a,b)=>a+b,0);
    st.innerHTML = head("Pregunta inicial", `<span class="counter num">${tot} votos</span>`) + `<div class="proj">
      <div class="dq">${esc(I.q)}</div>
      <div class="votes">${I.o.map((o,i)=>`<div class="vote"><button type="button" class="popt" data-voto="${i}"><span class="vbar" style="width:${tot?T.votos[i]/tot*100:0}%"></span><b>${L[i]}</b><span>${esc(o)}</span><span class="vc num">${T.votos[i]}</span></button><button type="button" class="minus" data-vmenos="${i}" aria-label="Quitar un voto">−</button></div>`).join("")}</div>
      <p class="hint">Votad a mano alzada. La respuesta la veremos después del vídeo.</p></div>
      <div class="row"><button class="btn big" data-paso="video">Ver el vídeo →</button></div>`;
  }
  else if(T.paso==="video"){
    marcar("video"); const v=S.videos[0];
    st.innerHTML = head("Vídeo de la sesión") + `<figure style="margin:0" class="stack"><div class="frame">${v.yt?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.yt)}?rel=0" title="${esc(v.t)}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`:`<video src="${esc(v.mp4)}" controls preload="metadata"></video>`}</div>
      <figcaption><span>${esc(v.t)}</span><a href="${v.yt?"https://www.youtube.com/watch?v="+esc(v.yt):esc(v.mp4)}" target="_blank" rel="noopener">Abrir en YouTube ↗</a></figcaption></figure>
      <p class="hint">Antes de darle al play: «Fijaos bien, al final veremos si acertasteis con la pregunta del principio».</p>
      <div class="row"><button class="btn big" data-paso="debate">Al debate →</button></div>`;
  }
  else if(T.paso==="debate"){
    const D=DEBATE[S.n], n=D.debate.length; T.di=T.di||0; T.dvis=T.dvis||[]; T.dsl=T.dsl||{}; T.drq=T.drq||{};
    if(!T.dvis.includes(T.di)) T.dvis.push(T.di);
    if(T.di>0) marcar("debate");
    const dots = `<div class="dots">${Array.from({length:n+1},(_,i)=>`<button type="button" data-dgo="${i}" aria-current="${T.di===i}" class="${T.dvis.includes(i)?"seen":""}" aria-label="${i?"Pregunta "+i:"Pregunta inicial"}">${i||"★"}</button>`).join("")}</div>`;
    const it = T.di===0 ? D.inicio : D.debate[T.di-1];
    const qtxt = it.q;
    const shown = T.di===0 ? true : !!T.dsl[T.di];
    const nrep = T.drq[T.di]||0;
    const repsHTML = nrep ? `<ul class="reps">${it.rep.slice(0,nrep).map(r=>`<li>${esc(r)}</li>`).join("")}</ul>` : "";
    let body;
    if(T.di===0){
      const v=T.votos||it.o.map(()=>0), tot=v.reduce((a,b)=>a+b,0);
      body = `<span class="eyebrow">Volvemos a la pregunta del principio</span>
        <div class="deck withmedia"><div class="dmedia dslide">${slideHTML(S.n,it.slide)}</div>
        <div class="stack" style="gap:14px;min-width:0"><div class="q">${esc(it.q)}</div>
        <div class="votes">${it.o.map((o,i)=>`<div class="popt ${i===it.ok?"right":"dim"}" style="position:relative;overflow:hidden"><span class="vbar" style="position:absolute;left:0;top:0;bottom:0;width:${tot?v[i]/tot*100:0}%;background:color-mix(in srgb,var(--${i===it.ok?"ok":"blue"}) 18%,transparent)"></span><b style="position:relative">${L[i]}</b><span style="position:relative">${esc(o)}</span><span class="num" style="position:relative;margin-left:auto;font-family:var(--f-display);font-size:1.6rem;font-weight:700">${v[i]}</span></div>`).join("")}</div>
        ${tot?`<div class="explain"><b>${v[it.ok]} de ${tot}</b> lo acertasteis antes del vídeo. ¿Quién cambiaría ahora su respuesta?</div>`:""}
        ${repsHTML}</div></div>`;
    } else if(shown){
      body = `<div class="slidefocus" id="slidefocus"><p class="qmini">${esc(qtxt)}</p><div class="bigsld">${slideHTML(S.n,it.slide)}</div></div>`;
    } else {
      body = `<div class="stack" style="gap:20px"><div class="dq">${esc(qtxt)}</div>${repsHTML}</div>`;
    }
    const masRep = nrep < it.rep.length ? `<button class="btn ghost" data-act="dRep">Otra pregunta</button>` : "";
    const accion = T.di===0 ? masRep
      : (shown ? `<button class="btn ghost" data-act="fullslide">Pantalla completa</button><button class="btn ghost" data-act="dSlide" data-off="1">Volver a la pregunta</button>`
               : `${masRep}<button class="btn orange" data-act="dSlide">Mostrar la diapositiva</button>`);
    st.classList.toggle("focus", T.di>0 && shown);
    st.innerHTML = head("Debate guiado", `<span class="pill num">${T.di||"★"} de ${n}</span>`) + `<div class="proj">${body}</div>
      <div class="row" style="justify-content:space-between"><div class="row"><button class="navbtn" data-dd="-1" ${T.di===0?"disabled":""} aria-label="Anterior">‹</button><button class="navbtn" data-dd="1" ${T.di===n?"disabled":""} aria-label="Siguiente">›</button>${accion}${T.di===n?`<button class="btn big" data-paso="test">Ir al test final →</button>`:""}</div>${dots}</div>`;
  }
  else if(T.paso==="test"){
    if(!H5P_LOCAL[S.n]){ st.innerHTML=head("Test final")+`<p class="hint">Esta sesión no tiene cuestionario con imágenes. Usa el test de repaso en Más recursos.</p>`; return; }
    const d=deckState("h5p"), last=d.i===deckItems("h5p").length-1 && d.sel[d.i]!==undefined;
    st.innerHTML = head("Test final", `<span class="pill">${esc(H5P_LOCAL[S.n].items.length)} preguntas con imágenes</span>`) + deckHTML("h5p") + (last?`<div class="row"><button class="btn big" data-paso="cierre">Ir al cierre →</button></div>`:"");
  }
  else if(T.paso==="recursos"){
    const door=(attr,tag,t,p,done)=>`<button class="door" ${attr} style="text-align:left;cursor:pointer;font:inherit"><span class="tag">${tag}</span><h2>${t}</h2><p>${p}</p>${done?'<span class="pill ok">Hecho</span>':""}</button>`;
    st.innerHTML = head("Más recursos") + `<p class="lead" style="max-width:none">Material de apoyo para ampliar o repasar. No forma parte del recorrido principal de la sesión.</p><div class="grid3">
      ${door('data-paso="presentacion"',"Material","Presentación completa",`Las ${S.slides} diapositivas de la sesión, a pantalla completa.`,T.hechas.includes("presentacion"))}
      ${S.videos.length>1?door('data-paso="videos"',"Material","Otros vídeos",`${S.videos.length-1} vídeos de apoyo sobre prevención.`,false):""}
      ${door('data-amodo="test"',"Repaso","Test de repaso",`${S.quiz.length} preguntas sin imágenes.`,T.hechas.includes("test"))}
      ${S.acts.map((a,i)=>door(`data-amodo="act${i}"`,"Actividad práctica",esc(a.titulo),esc(a.enun),T.hechas.includes("act"+i))).join("")}
      ${door('data-amodo="individual"',"Con portátiles","Trabajo individual","Cada alumno entra con un código, elige su nombre y hace test, actividades y reflexión. Las notas se guardan con su nombre.",T.hechas.includes("individual"))}
      ${C.fichaInfo&&S.n===C.fichaInfo.sesion?`<a class="door" href="#ficha" target="_blank" rel="noopener"><span class="tag">Para imprimir</span><h2>${esc(C.fichaInfo.titulo)}</h2><p>Ficha para repartir y hacer en el aula o el taller.</p></a>`:""}
    </div>`;
  }
  else if(T.paso==="guion"){
    const g=S.guion;
    st.innerHTML = head("Guion para el profesor/a") + `<div class="guion">
      <div class="card stack" style="gap:12px"><h3>Objetivo</h3><p>${esc(g.objetivo)}</p><h3>Mensajes clave</h3><ul>${g.claves.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
      ${g.aviso?`<div class="banner"><b>Atención:</b> ${esc(g.aviso)}</div>`:""}</div>
      <div class="stack" style="gap:16px"><div class="card stack" style="gap:10px"><h3>Temporización · 55 min</h3><div class="tiempo">${(g.tiempos||TIEMPOS_DEBATE).map(([m,t])=>`<div><b class="num">${m}′</b><span>${esc(t)}</span></div>`).join("")}</div></div>
      <div class="card stack" style="gap:10px"><h3>Guion del debate</h3><p class="ideas">Esta pantalla es tu preparación: en la pizarra, durante el debate, el alumnado solo ve la pregunta, las repreguntas y la diapositiva.</p><ol class="guide"><li><b>Antes del vídeo:</b> ${esc(DEBATE[S.n].inicio.q)}<div class="sub">Respuesta: ${esc(DEBATE[S.n].inicio.o[DEBATE[S.n].inicio.ok])}</div><div class="sub">La diapositiva ${DEBATE[S.n].inicio.slide} recoge: ${esc(DEBATE[S.n].inicio.idea)}</div></li>${DEBATE[S.n].debate.map(d=>`<li>${esc(d.q)}<div class="sub">Repreguntas: ${d.rep.map(esc).join(" · ")}</div><div class="sub">La diapositiva ${d.slide} recoge: ${esc(d.idea)}</div></li>`).join("")}</ol>
      ${isEmbedded?"":`<button class="btn ghost no-print" data-act="imprimir">Imprimir el guion</button>`}</div>
      ${g.enlaces?`<div class="card stack" style="gap:10px"><h3>Para saber más</h3><ul>${g.enlaces.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.t)} ↗</a></li>`).join("")}</ul></div>`:""}</div></div>
      <div class="row no-print"><button class="btn big" data-paso="inicio">Empezar: pregunta inicial →</button></div>`;
  }
  else if(T.paso==="presentacion"){
    marcar("presentacion");
    st.innerHTML = head("Presentación", `<div class="row"><button class="btn ghost" data-paso="recursos">← Más recursos</button><button class="btn ghost" data-act="fullscreen">Pantalla completa</button></div>`) +
      `<div class="slidebox" id="slidebox"><div id="slideImg">${slideHTML(S.n,T.slide)}</div><button class="tap l" data-slide="-1" aria-label="Anterior"></button><button class="tap r" data-slide="1" aria-label="Siguiente"></button></div>
      <div class="slidebar"><button class="navbtn" data-slide="-1" aria-label="Anterior">‹</button><span class="pos num" id="slidePos">${T.slide} / ${S.slides}</span><button class="navbtn" data-slide="1" aria-label="Siguiente">›</button><span class="hint">También con las flechas del teclado o el mando de presentaciones.</span></div>
      <div class="thumbs" id="thumbs">${Array.from({length:S.slides},(_,i)=>`<button type="button" data-goto="${i+1}" aria-current="${T.slide===i+1}">${slideHTML(S.n,i+1)}</button>`).join("")}</div>`;
  }
  else if(T.paso==="videos"){
    const vids = S.videos.slice(1).map((v,i)=>`<figure><div class="frame">${v.yt?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.yt)}?rel=0" title="${esc(v.t)}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`:`<video src="${esc(v.mp4)}" controls preload="none"></video>`}</div>
      <figcaption><span>${esc(v.t)}</span><a href="${v.yt?"https://www.youtube.com/watch?v="+esc(v.yt):esc(v.mp4)}" target="_blank" rel="noopener" data-marca="video">Abrir aparte ↗</a></figcaption></figure>`).join("");
    st.innerHTML = head("Otros vídeos", `<button class="btn ghost" data-paso="recursos">← Más recursos</button>`) + `<div class="media" data-media="video">${vids}</div>${S.h5p.length?`<h2>H5P</h2><div class="media">${S.h5p.map(h=>`<figure><div class="frame h5p"><iframe src="${esc(h.url)}" title="${esc(h.t)}" allowfullscreen loading="lazy"></iframe></div><figcaption><span>${esc(h.t)}</span></figcaption></figure>`).join("")}</div>`:""}`;
  }
  else if(T.paso==="actividades"){
    const modo = T.amodo || "menu";
    if(modo==="menu"){ T.paso="recursos"; saveT(); renderSesion(); return; }
    if(false){
      st.innerHTML = head("Actividades") + `<div class="grid3">
        <button class="door" data-amodo="test" style="text-align:left;cursor:pointer;font:inherit"><span class="tag">En gran grupo</span><h2>Test proyectado</h2><p>${S.quiz.length} preguntas. La clase responde en voz alta y tú tocas la opción elegida.</p>${T.hechas.includes("test")?'<span class="pill ok">Hecho</span>':""}</button>
        ${H5P_LOCAL[S.n]?`<button class="door" data-amodo="h5p" style="text-align:left;cursor:pointer;font:inherit"><span class="tag">H5P · En gran grupo</span><h2>${esc(H5P_LOCAL[S.n].titulo)}</h2><p>${H5P_LOCAL[S.n].items.length} preguntas con imágenes.</p>${T.hechas.includes("h5p")?'<span class="pill ok">Hecho</span>':""}</button>`:""}
        ${S.acts.map((a,i)=>`<button class="door" data-amodo="act${i}" style="text-align:left;cursor:pointer;font:inherit"><span class="tag">En gran grupo</span><h2>${esc(a.titulo)}</h2><p>${esc(a.enun)}</p>${T.hechas.includes("act"+i)?'<span class="pill ok">Hecho</span>':""}</button>`).join("")}
        <button class="door main" data-amodo="individual" style="text-align:left;cursor:pointer;font:inherit"><span class="tag">Con portátiles</span><h2>Trabajo individual</h2><p>Cada alumno entra con un código, elige su nombre y hace test, actividades y reflexión. Las notas se guardan con su nombre.</p>${T.codigo?`<span class="pill ok">Código ${esc(T.codigo)}</span>`:""}</button>
      </div>`;
    }
    else if(modo==="test"||modo==="h5p"){
      st.innerHTML = head(modo==="test"?"Test de repaso":"Test final", `<button class="btn ghost" data-paso="recursos">← Más recursos</button>`) + deckHTML(modo);
    }
    else if(modo.startsWith("act")){
      const i=+modo.slice(3), A=S.acts[i]; marcar("act"+i);
      const key=`${T.sesion}-${i}`; const w = gw[key] || (gw[key]=newActWork(A));
      st.innerHTML = head(esc(A.titulo), `<button class="btn ghost" data-paso="recursos">← Más recursos</button>`) +
        `<p class="lead" style="max-width:none">${esc(A.enun)}</p><div id="actBox" data-gkey="${key}" data-ai="${i}">${actHTML(A,w,key)}</div>
        <div class="row">${w.corr?`<button class="btn ghost" data-act="gReset" data-gkey="${key}">Volver a empezar</button>`:`<button class="btn big" data-act="gCorregir" data-gkey="${key}">Corregir con la clase</button>`}</div>`;
    }
    else if(modo==="individual"){
      if(!T.codigo){
        st.innerHTML = head("Trabajo individual con portátiles", `<button class="btn ghost" data-paso="recursos">← Más recursos</button>`) + `<div class="card stack"><p class="lead">Se generará un código de 4 caracteres válido durante 4 horas. El alumnado lo escribe en <b>Soy alumno/a</b> y elige su nombre de la lista de ${esc(T.grupo)}.</p><div class="row"><button class="btn big orange" data-act="abrirCodigo">Generar código</button><span id="codErr" class="err"></span></div></div>`;
      } else {
        const url = location.href.split("#")[0]+"#alumno";
        st.innerHTML = head("Trabajo individual con portátiles", `<button class="btn ghost" data-paso="recursos">← Más recursos</button>`) + `<div class="card stack" style="align-items:center;text-align:center;gap:14px">
          <span class="eyebrow">Entrad en</span><span style="font-size:1.4rem;font-weight:600;word-break:break-all">${esc(url)}</span><span class="eyebrow">pulsad «Soy alumno/a» y escribid el código</span>
          <span class="codebig">${esc(T.codigo)}</span>
          <div class="row" style="justify-content:center"><button class="btn ghost" data-act="contar">Ver cuántos han entregado</button><span id="entregas" class="counter num"></span></div>
          <div id="entregasNombres" class="hint" style="max-width:70ch"></div></div>`;
      }
    }
  }
  else if(T.paso==="cierre"){
    const opts=[["asistencia","Pasar lista"],["inicio","Pregunta inicial"],["video","Vídeo"],["debate","Debate guiado"],["h5p","Test final en gran grupo"],["presentacion","Presentación completa"],["test","Test de repaso"],...S.acts.map((a,i)=>["act"+i,a.titulo+" (gran grupo)"]),["individual","Trabajo individual con portátiles"],["ficha","Ficha: "+((C.fichaInfo||{}).titulo||"ficha")]];
    const pres=T.alumnos.length-T.ausentes.length;
    st.innerHTML = head("Cierre y acta de la sesión") + (T.guardada?`<div class="card stack" style="gap:10px"><h2 class="okt">Acta guardada</h2><p>${esc(T.grupo)} · Sesión ${S.n} · ${pres} presentes de ${T.alumnos.length}. Queda registrada en la hoja del centro.</p><div class="row"><button class="btn" data-act="nuevaSesion">Terminar y volver a grupos</button></div></div>`:
      `<div class="grid2"><div class="card stack" style="gap:10px"><h3>Resumen</h3>
        <p><b>Grupo:</b> ${esc(T.grupo)}<br><b>Sesión:</b> ${S.n} · ${esc(S.titulo)}<br><b>Profesor/a:</b> ${esc(T.tutor)}<br><b>Hora:</b> ${esc(T.contexto||"—")}<br><b>Fecha:</b> ${new Date().toLocaleDateString("es-ES")}</p>
        <p><b class="num">${pres}</b> presentes · <b class="num">${T.ausentes.length}</b> ausentes${T.ausentes.length?": "+esc(T.ausentes.join(", ")):""}</p>
        ${T.codigo?`<p>Código de trabajo individual: <b>${esc(T.codigo)}</b></p>`:""}
        ${T.hechas.includes("asistencia")?"":`<p class="err">No has confirmado la lista. Revisa el paso 1.</p>`}</div>
       <div class="card stack" style="gap:10px"><h3>Observaciones</h3><textarea id="obs" data-obs maxlength="1000" placeholder="Incidencias, participación, dudas del grupo…">${esc(T.obs)}</textarea></div></div>
       <section class="stack" style="gap:10px"><h3>Actividades realizadas</h3><div class="checks">${opts.map(([k,l])=>`<label><input type="checkbox" data-hecha="${k}" ${T.hechas.includes(k)?"checked":""}> ${esc(l)}</label>`).join("")}</div></section>
       <div class="row"><button class="btn big orange" data-act="guardarActa">Guardar acta de la sesión</button><span id="actaMsg" class="hint" role="status"></span></div>`);
  }
}

/* ---------- cuestionario proyectado (test y H5P) ---------- */
function deckItems(kind){ const S=sesion(T.sesion); return kind==="test" ? S.quiz : (H5P_LOCAL[S.n]||{items:[]}).items; }
function deckState(kind){ T.dk=T.dk||{}; if(!T.dk[kind]){ T.dk[kind]={i:0, ord:deckItems(kind).map(q=>shuffle(q.o.map((_,j)=>j))), sel:{}}; } return T.dk[kind]; }
function deckResumen(kind){ const d=T.dk&&T.dk[kind]; if(!d) return null; const v=Object.values(d.sel); return {ok:v.filter(x=>x===0).length, resp:v.length, total:deckItems(kind).length}; }
function deckHTML(kind){
  const items=deckItems(kind), d=deckState(kind), q=items[d.i], ch=d.sel[d.i], rev=ch!==undefined, r=deckResumen(kind);
  const media = q.yt ? `<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${esc(q.yt)}?rel=0" title="Vídeo" allow="encrypted-media; fullscreen" allowfullscreen></iframe></div>` : (q.img ? `<img src="${q.img}" alt="">` : (q.sl && rev ? slideHTML(T.sesion,q.sl) : q.imgAfter && rev ? `<img src="${CONFIG.CARPETA_DIAPOSITIVAS}${esc(q.imgAfter)}" alt="Diapositiva de la presentación con la explicación">` : ""));
  return `<div class="proj">

function newActWork(A){

function actHTML(A,w,key){
  const R=w.corr;
  if(A.tipo==="clasificar") return `<div class="cls">${w.order.map(ii=>{ const it=A.items[ii], s=w.sel[ii], st=R?(s===it.c?"good":"wrong"):"";
    return `<div class="it ${st}"><span>${esc(it.t)}</span><div class="seg" role="group">${A.cats.map((c,ci)=>`<button type="button" data-k="${key}" data-cls="${ii}" data-cat="${ci}" aria-pressed="${s===ci}" ${R?"disabled":""}>${esc(c)}</button>`).join("")}</div>${R&&s!==it.c?`<span class="fb wrong">Correcto: <b>${esc(A.cats[it.c])}</b></span>`:""}</div>`; }).join("")}</div>`;
  if(A.tipo==="ordenar") return `<ol class="ord">${w.order.map((ii,pos)=>{ const st=R?(ii===pos?"good":"wrong"):"";
    return `<li class="${st}"><span class="pos num">${pos+1}</span><span class="t">${esc(A.items[ii])}${R&&ii!==pos?` <small class="err">(va en el ${ii+1}º lugar)</small>`:""}</span>${R?"":`<span class="mv"><button type="button" data-k="${key}" data-mv="${pos}" data-dir="-1" aria-label="Subir" ${pos===0?"disabled":""}>▲</button><button type="button" data-k="${key}" data-mv="${pos}" data-dir="1" aria-label="Bajar" ${pos===w.order.length-1?"disabled":""}>▼</button></span>`}</li>`; }).join("")}</ol>`;
  return `<div class="picks">${w.order.map(ii=>{ const it=A.items[ii], s=!!w.sel[ii], st=R?((s===it.ok)?"good":"wrong"):"";
    return `<label class="pick ${st}"><input type="checkbox" data-k="${key}" data-pick="${ii}" ${s?"checked":""} ${R?"disabled":""}> <span>${esc(it.t)}${R&&st==="wrong"?`<br><small class="err">${it.ok?"Debía marcarse":"No debía ir"}</small>`:""}</span></label>`; }).join("")}</div>`;
}
function puntuar(A,w){
  if(A.tipo==="clasificar"){ const ok=A.items.filter((it,i)=>w.sel[i]===it.c).length; return {ok,total:A.items.length,p:ok/A.items.length}; }
  if(A.tipo==="ordenar"){ const ok=w.order.filter((v,i)=>v===i).length; return {ok,total:A.items.length,p:ok/A.items.length}; }
  const buenas=A.items.filter(i=>i.ok).length, ac=A.items.filter((it,i)=>it.ok&&w.sel[i]).length, er=A.items.filter((it,i)=>!it.ok&&w.sel[i]).length;
  const ok=A.items.filter((it,i)=>!!w.sel[i]===it.ok).length;
  return {ok,total:A.items.length,p:Math.max(0,(ac-er)/buenas)};
}

async function leerCSV(file){
  const buf = await file.arrayBuffer();
  let text; try{ text=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder("windows-1252").decode(buf); }
  text = text.replace(/^﻿/,"");
  const rows = parseCSV(text).filter(r=>r.some(c=>c.trim()!==""));
  let h = rows.findIndex(r=>r.filter(c=>c.trim()).length>=2 && r.some(c=>/alumn|nombre|apellido/i.test(c)) && r.some(c=>/unidad|grupo|curso/i.test(c)));
  if(h<0) h = rows.findIndex(r=>r.filter(c=>c.trim()).length>=2 && r.some(c=>/alumn|nombre|apellido/i.test(c)));
  if(h<0) h=0;
  const header = rows[h].map(c=>c.trim());
  const data = rows.slice(h+1).filter(r=>r.length>1);
  const find = re => header.findIndex(c=>re.test(c));
  // Columnas con texto (no códigos numéricos)
  const conTexto = i => data.slice(0,30).some(r=>/[a-záéíóúñ]/i.test(r[i]||""));
  const findT = re => header.findIndex((c,i)=>re.test(c) && conTexto(i));
  const ap1 = findT(/primer apellido|apellido ?1|^apellidos?$/i);
  const map = {
    ap1,
    ap2: findT(/segundo apellido|apellido ?2/i),
    nombre: ap1>=0 && findT(/^nombre$/i)>=0 ? findT(/^nombre$/i)
          : (findT(/^alumno|apellidos.*nombre|nombre.*apellidos/i)>=0 ? findT(/^alumno|apellidos.*nombre|nombre.*apellidos/i) : findT(/^nombre$/i)),
    grupo: findT(/^unidad|^grupo/i) >= 0 ? findT(/^unidad|^grupo/i) : findT(/curso|estudios/i),
    estado: header.findIndex(c=>/estado|resmatricula/i.test(c))
  };
  if(map.ap1>=0 && map.nombre>=0 && /^alumno/i.test(header[map.nombre])) { map.ap1=-1; map.ap2=-1; }
  CSV = {header, data, map, file:file.name};
  pintarCSV();
}
function parseCSV(t){
  const first = t.split(/\r?\n/).find(l=>l.trim())||"";
  const sep = [";",",","\t"].map(s=>[s,(first.match(new RegExp(s==="\t"?"\t":"\\"+s,"g"))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const out=[]; let row=[], cell="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cell); out.push(row); row=[]; cell=""; }
    else cell+=c; }
  if(cell||row.length){ row.push(cell); out.push(row); }
  return out;
}
function alumnosDesdeCSV(){
  const {data,map}=CSV; const v=(r,i)=>i>=0?String(r[i]||"").trim().replace(/\s+/g," "):"";
  const res=[], vistos=new Set(); let anuladas=0;
  data.forEach(r=>{
    let nombre = map.ap1>=0 ? `${[v(r,map.ap1),v(r,map.ap2)].filter(Boolean).join(" ")}, ${v(r,map.nombre)}` : v(r,map.nombre);
    nombre = nombre.replace(/^,\s*|,\s*$/g,"");
    const grupo = v(r,map.grupo);
    if(!nombre || !grupo) return;
    if(r.some(c=>/^\s*(anulad|baja)/i.test(c))) { anuladas++; return; }
    const k=(grupo+"|"+nombre).toLowerCase(); if(vistos.has(k)) return; vistos.add(k);
    res.push({grupo,nombre});
  });
  CSV.anuladas=anuladas;
  return res;
}
function pintarCSV(){
  const out=document.getElementById("csvOut"); if(!CSV||!out) return;
  const {header,map}=CSV;
  const sel=(k,l,opt)=>`<label for="m_${k}">${l}<select id="m_${k}" data-map="${k}">${opt?'<option value="-1">— No usar —</option>':""}${header.map((h,i)=>`<option value="${i}" ${map[k]===i?"selected":""}>${esc(h||"Columna "+(i+1))}</option>`).join("")}</select></label>`;
  const al=alumnosDesdeCSV(); const grupos={}; al.forEach(a=>grupos[a.grupo]=(grupos[a.grupo]||0)+1);
  out.innerHTML = `<div class="stack">
   <section class="card stack" style="gap:12px"><h2>Columnas del archivo <span class="hint">${esc(CSV.file)}</span></h2>
    <div class="grid2">${sel("nombre","Alumno/a o nombre",false)}${sel("grupo","Unidad / grupo",false)}${sel("ap1","Primer apellido (si va aparte)",true)}${sel("ap2","Segundo apellido (si va aparte)",true)}</div></section>
   <section class="card stack" style="gap:12px"><div class="row" style="justify-content:space-between"><h2 class="num">${al.length} alumnos · ${Object.keys(grupos).length} grupos</h2></div>
    <div class="row">${Object.keys(grupos).sort().map(g=>`<span class="pill num">${esc(g)} · ${grupos[g]}</span>`).join("")}</div>
    <div class="tablewrap"><table><thead><tr><th>Grupo</th><th>Alumno/a</th></tr></thead><tbody>${al.slice(0,8).map(a=>`<tr><td>${esc(a.grupo)}</td><td>${esc(a.nombre)}</td></tr>`).join("")}</tbody></table></div>
    <span class="hint">Vista previa de los 8 primeros. Comprueba que nombre y grupo salen bien antes de subir.${CSV.anuladas?` Se han descartado ${CSV.anuladas} matrículas anuladas o de baja.`:""}</span></section>
   <div class="row"><button class="btn big orange" data-act="subirCSV" ${al.length?"":"disabled"}>Subir ${al.length} alumnos al registro</button><span id="upMsg" role="status"></span></div></div>`;
}

    const tutor=f.elements.namedItem("tutor").value.trim(), clave=f.elements.namedItem("clave").value.trim(), er=document.getElementById("loginErr");
    if(!tutor||!clave){ er.textContent="Escribe tu nombre y la clave."; return; }
    er.textContent="Comprobando… (la primera conexión puede tardar unos segundos)";
    f.querySelector("[type=submit]").disabled=true;
    const r=await api("grupos",{clave});
    f.querySelector("[type=submit]").disabled=false;
    if(!r.ok){ er.textContent=r.error||"Clave incorrecta."; return; }
    GRUPOS=r; ss("aulaPRL_acceso",{tutor,clave});
    const c=await cargarContenido(clave);
    if(!c.ok){ er.textContent=c.error||"No se ha podido cargar el material."; return; }
    renderTutor();
  }
  if(f.dataset.form==="codigo"){
    const codigo=f.elements.namedItem("codigo").value.trim().toUpperCase(), er=document.getElementById("codErr2");
    if(codigo.length!==4){ er.textContent="El código tiene 4 caracteres."; return; }
    er.textContent="Comprobando…";
    const r=await api("sesion",{codigo});
    if(!r.ok){ er.textContent=r.error||"Código no válido."; return; }
    if(r.contenido) SESIONES[+r.sesion-1] = Object.assign({n:+r.sesion}, r.contenido, MEDIA[r.sesion]);
    AW={codigo, grupo:r.grupo, sesion:+r.sesion, alumnos:r.alumnos}; renderAlumno();
  }
  if(f.dataset.form==="quien"){
    const al=f.elements.namedItem("alumno").value; if(!al) return;
    AW = nuevoTrabajoAlumno({codigo:AW.codigo, grupo:AW.grupo, sesion:AW.sesion, alumnos:AW.alumnos, alumno:al});
    renderAlumno(); window.scrollTo(0,0);
  }
  if(f.dataset.form==="entrega"){
    const S=sesion(AW.sesion), er=document.getElementById("entErr"), errs=[];
    const faltan=S.quiz.filter((_,i)=>AW.ans[i]===undefined).length; if(faltan) errs.push(`Faltan ${faltan} preguntas del test.`);
    S.acts.forEach((A,i)=>{ const w=AW.acts[`${S.n}-${i}`];
      if(A.tipo==="clasificar"){ const fc=A.items.filter((_,j)=>w.sel[j]===undefined).length; if(fc) errs.push(`Faltan ${fc} elementos en «${A.titulo}».`); }
      if(A.tipo==="seleccionar" && !Object.values(w.sel).some(Boolean)) errs.push(`Marca algún objeto en «${A.titulo}».`); });
    if(AW.refl.trim().length<30) errs.push("La reflexión debe tener al menos 30 caracteres.");
    if(errs.length){ er.textContent=errs.join(" "); er.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const aciertos=S.quiz.filter((_,i)=>AW.ans[i]===0).length;
    const ps=S.acts.map((A,i)=>puntuar(A,AW.acts[`${S.n}-${i}`]));
    const pAct=ps.reduce((a,b)=>a+b.p,0)/ps.length;
    const nota=Math.round(((aciertos/S.quiz.length)*6+pAct*4)*10)/10;
    const act=ps.map(p=>`${p.ok}/${p.total}`).join(" + ");
    f.querySelector('[type=submit]').disabled=true; er.textContent="Enviando…";
    const envio=await api("resultado",{codigo:AW.codigo, alumno:AW.alumno, nota, test:`${aciertos}/${S.quiz.length}`, actividad:act, reflexion:AW.refl.trim()});
    AW.result={nota, test:`${aciertos}/${S.quiz.length}`, act, envio};
    renderAlumno(); window.scrollTo(0,0);
  }
});

app.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.q!==undefined && AW){ AW.ans[+t.dataset.q]=+t.value; }
  else if(t.dataset.pick!==undefined){ const w=getWork(t.dataset.k); w.sel[+t.dataset.pick]=t.checked; }
  else if(t.dataset.hecha!==undefined){ const k=t.dataset.hecha; T.hechas=T.hechas.filter(x=>x!==k); if(t.checked) T.hechas.push(k); saveT(); }
  else if(t.dataset.map){ CSV.map[t.dataset.map]=+t.value; pintarCSV(); }
});
app.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.refl!==undefined && AW) AW.refl=t.value;
  if(t.dataset.obs!==undefined && T){ T.obs=t.value; saveT(); }
});

app.addEventListener("click", async e=>{
  const b=e.target.closest("button, a[data-marca]"); if(!b) return;
  if(b.dataset.marca){ marcar(b.dataset.marca); return; }
  // selección de sesión
  if(b.dataset.ctx){ ss("aulaPRL_sel",{...(ss("aulaPRL_sel")||{}),contexto:b.dataset.ctx}); document.querySelectorAll("[data-ctx]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); return; }
  if(b.dataset.ses){ ss("aulaPRL_sel",{...(ss("aulaPRL_sel")||{}),sesion:+b.dataset.ses}); document.querySelectorAll("[data-ses]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); return; }
  if(b.dataset.paso){ irPaso(b.dataset.paso); return; }
  if(b.dataset.al!==undefined){ const nm=T.alumnos[+b.dataset.al]; const aus=T.ausentes.includes(nm);
    T.ausentes = aus ? T.ausentes.filter(x=>x!==nm) : [...T.ausentes,nm]; saveT();
    b.setAttribute("aria-pressed", aus?"true":"false"); b.querySelector(".st").textContent = aus?"Presente":"Ausente";
    document.getElementById("cnt").textContent = `${T.alumnos.length-T.ausentes.length} / ${T.alumnos.length} presentes`; return; }
  if(b.dataset.slide){ moverSlide(+b.dataset.slide); return; }
  if(b.dataset.goto){ T.slide=+b.dataset.goto; saveT(); actualizarSlide(); return; }
  if(b.dataset.amodo){ T.amodo=b.dataset.amodo; if(T.paso!=="actividades"){ T.paso="actividades"; saveT(); renderSesion(); } else { saveT(); pintarPaso(); } window.scrollTo(0,0); return; }
  if(b.dataset.voto!==undefined){ const I=DEBATE[T.sesion].inicio; T.votos=T.votos||I.o.map(()=>0); T.votos[+b.dataset.voto]++; marcar("inicio"); saveT(); pintarPaso(); return; }
  if(b.dataset.vmenos!==undefined){ if(T.votos&&T.votos[+b.dataset.vmenos]>0){ T.votos[+b.dataset.vmenos]--; saveT(); pintarPaso(); } return; }
  if(b.dataset.dd){ debateMove(+b.dataset.dd); return; }
  if(b.dataset.dgo!==undefined){ T.di=+b.dataset.dgo; saveT(); pintarPaso(); return; }
  if(b.dataset.opt!==undefined){ const k=b.dataset.dk, d=deckState(k); d.sel[d.i]=+b.dataset.opt; marcar(k); saveT(); pintarPaso(); return; }
  if(b.dataset.dmv){ deckMove(b.dataset.dk, +b.dataset.dmv); return; }
  if(b.dataset.cls!==undefined){ const w=getWork(b.dataset.k); w.sel[+b.dataset.cls]=+b.dataset.cat; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); return; }
  if(b.dataset.mv!==undefined){ const key=b.dataset.k, w=getWork(key), A=getAct(key), pos=+b.dataset.mv, d=+b.dataset.dir;
    [w.order[pos],w.order[pos+d]]=[w.order[pos+d],w.order[pos]];
    const box=document.getElementById("box-"+key)||document.getElementById("actBox"); box.innerHTML=actHTML(A,w,key);
    const nb=box.querySelector(`[data-mv="${pos+d}"][data-dir="${d}"]`)||box.querySelector(`[data-mv="${pos+d}"]`); if(nb) nb.focus(); return; }

  const act=b.dataset.act; if(!act) return;
  if(act==="empezar") empezarSesion();
  if(act==="salir"){ ss("aulaPRL_acceso",null); ss("aulaPRL_cont",null); GRUPOS=null; C=null; renderTutor(); }
  if(act==="okAsistencia"){ marcar("asistencia"); irPaso("inicio"); }
  if(act==="fullslide"){ const el=document.getElementById("slidefocus"); try{ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }catch(err){} }
  if(act==="fullscreen"){ const el=document.getElementById("slidebox"); try{ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }catch(err){} }
  if(act==="dSlide"){ T.dsl=T.dsl||{}; T.dsl[T.di]=!b.dataset.off; saveT(); pintarPaso(); }
  if(act==="dRep"){ T.drq=T.drq||{}; T.drq[T.di]=(T.drq[T.di]||0)+1; saveT(); pintarPaso(); }
  if(act==="dReveal"){ const k=b.dataset.dk, d=deckState(k); d.sel[d.i]=-1; marcar(k); saveT(); pintarPaso(); }
  if(act==="gCorregir"){ gw[b.dataset.gkey].corr=true; pintarPaso(); }
  if(act==="gReset"){ gw[b.dataset.gkey]=newActWork(getAct(b.dataset.gkey)); pintarPaso(); }
  if(act==="abrirCodigo"){ const acc=ss("aulaPRL_acceso")||{}; const er=document.getElementById("codErr"); er.textContent="Generando…";
    const r=await api("abrirSesion",{clave:acc.clave, grupo:T.grupo, sesion:T.sesion, tutor:T.tutor});
    if(!r.ok){ er.textContent=r.error||"No se ha podido generar."; return; } T.codigo=r.codigo; marcar("individual"); saveT(); pintarPaso(); }
  if(act==="contar"){ const acc=ss("aulaPRL_acceso")||{}; const r=await api("contarResultados",{clave:acc.clave, codigo:T.codigo});
    if(r.ok){ document.getElementById("entregas").textContent=`${r.n} entregas`; document.getElementById("entregasNombres").textContent=r.nombres.join(" · "); } }
  if(act==="guardarActa"){ const acc=ss("aulaPRL_acceso")||{}, msg=document.getElementById("actaMsg"); b.disabled=true; msg.textContent="Guardando…";
    const presentes=T.alumnos.filter(a=>!T.ausentes.includes(a));
    const I0=DEBATE[T.sesion].inicio, vt=(T.votos||[]).reduce((a,b)=>a+b,0);
    const resI = vt?`Pregunta inicial: ${T.votos[I0.ok]}/${vt} acertaron antes del vídeo`:null;
    const resD = (T.dvis||[]).filter(i=>i>0).length ? `Debate: ${(T.dvis||[]).filter(i=>i>0).length}/${DEBATE[T.sesion].debate.length} preguntas` : null;
    const resG=[["h5p","Test final"],["test","Test de repaso"]].map(([k,l])=>{ const r=deckResumen(k); return r&&r.resp?`${l}: ${r.ok}/${r.total} aciertos`:null; }).filter(Boolean).concat([resI,resD].filter(Boolean)).join(" · ");
    const r=await api("acta",{clave:acc.clave, grupo:T.grupo, sesion:T.sesion, titulo:sesion(T.sesion).titulo, tutor:T.tutor, presentes, ausentes:T.ausentes, actividades:T.hechas.map(k=>({asistencia:"Lista",inicio:"Pregunta inicial",video:"Vídeo",debate:"Debate guiado",h5p:"Test final",presentacion:"Presentación completa",test:"Test de repaso",individual:"Trabajo individual",ficha:"Ficha mapa de riesgos"})[k] || (k.startsWith("act")?(sesion(T.sesion).acts[+k.slice(3)]||{}).titulo||k:k)), observaciones:[T.obs.trim(),resG].filter(Boolean).join(" | "), codigo:T.codigo||"", contexto:T.contexto||""});
    if(!r.ok){ b.disabled=false; msg.className="err"; msg.textContent=r.error||"No se ha podido guardar. Inténtalo de nuevo."; return; }
    T.guardada=true; saveT(); renderSesion(); }
  if(act==="nuevaSesion"){ T=null; GRUPOS=null; ss("aulaPRL_tutor",null); location.hash="#tutor"; }
  if(act==="otroCodigo"){ AW=null; renderAlumno(); }
  if(act==="siguienteAlumno"){ AW={codigo:AW.codigo, grupo:AW.grupo, sesion:AW.sesion, alumnos:AW.alumnos}; renderAlumno(); window.scrollTo(0,0); }
  if(act==="imprimir") window.print();
  if(act==="subirCSV"){ const clave=document.getElementById("ad_clave").value.trim(), curso=document.getElementById("ad_curso").value.trim(), msg=document.getElementById("upMsg");
    if(!clave){ msg.className="err"; msg.textContent="Escribe la clave de administración."; return; }
    const alumnos=alumnosDesdeCSV(); b.disabled=true; msg.className="hint"; msg.textContent="Subiendo…";
    const r=await api("cargarAlumnado",{clave, curso, alumnos}); GRUPOS=null;
    b.disabled=false; msg.className=r.ok?"okt":"err"; msg.textContent=r.ok?`Cargados ${r.n} alumnos para el curso ${curso}.`:(r.error||"No se ha podido subir."); }
});

function moverSlide(d){ const S=sesion(T.sesion); T.slide=Math.max(1,Math.min(S.slides,T.slide+d)); saveT(); actualizarSlide(); }
function actualizarSlide(){
  const S=sesion(T.sesion), img=document.getElementById("slideImg"); if(!img) return;
  img.innerHTML=slideHTML(S.n,T.slide);
  document.getElementById("slidePos").textContent=`${T.slide} / ${S.slides}`;
  document.querySelectorAll("#thumbs button").forEach(x=>x.setAttribute("aria-current", +x.dataset.goto===T.slide?"true":"false"));
  const cur=document.querySelector('#thumbs [aria-current="true"]'); if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
}
document.addEventListener("keydown", e=>{
  if(location.hash!=="#sesion" || !T) return;
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  const fwd=["ArrowRight","PageDown"," "], back=["ArrowLeft","PageUp"];
  if(T.paso==="presentacion"){ if(fwd.includes(e.key)){ e.preventDefault(); moverSlide(1); } if(back.includes(e.key)){ e.preventDefault(); moverSlide(-1); } }
  if(T.paso==="debate"){ if(fwd.includes(e.key)){ e.preventDefault(); debateMove(1); } if(back.includes(e.key)){ e.preventDefault(); debateMove(-1); } }
  if(T.paso==="test"){ if(fwd.includes(e.key)){ e.preventDefault(); deckMove("h5p",1); } if(back.includes(e.key)){ e.preventDefault(); deckMove("h5p",-1); } }
  if(T.paso==="actividades" && (T.amodo==="test"||T.amodo==="h5p")){ if(fwd.includes(e.key)){ e.preventDefault(); deckMove(T.amodo,1); } if(back.includes(e.key)){ e.preventDefault(); deckMove(T.amodo,-1); } }
});

document.getElementById("centroTxt").textContent = CONFIG.CENTRO + " · Tutoría y guardias";
document.getElementById("creditTxt").textContent = "Material propio del " + CONFIG.CENTRO + " · " + CONFIG.LOCALIDAD + ".";
window.addEventListener("hashchange", route);
route();
</script>
